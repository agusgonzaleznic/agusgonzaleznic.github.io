name: CI

on:
  # Trigger on pull requests to main
  pull_request:
    branches:
      - main

  # Allow manual workflow dispatch
  workflow_dispatch:

# Supersede an in-flight run when the branch is pushed again. deploy.yml,
# terraform.yml and synthetic.yml all set one of these; ci.yml did not, so three
# pushes in a minute queued three builds AND three browser suites against commits
# nobody was waiting on any more. Never cancels on the default branch, where each
# commit's result is a record worth keeping.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Skip-job pattern: the workflow ALWAYS runs (no top-level paths filter), so the
# required status check "CI required" always reports. A cheap `changes` job
# decides whether the site actually changed; the expensive build only runs when
# it did; and the gate job passes when the build succeeded OR was skipped. This
# gives path-based efficiency without the required-check deadlock that a
# top-level `paths:` filter would cause (a skipped workflow never reports its
# required check, blocking the PR forever).

permissions:
  contents: read

jobs:
  changes:
    name: Detect site changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      site: ${{ steps.filter.outputs.site }}
      tests: ${{ steps.filter.outputs.tests }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether the built site can be affected
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Denylist / fail-safe: site=true unless EVERY changed file matches an
          # ignore pattern (infra, docs, CI-only config). Same set as deploy.yml's
          # paths-ignore. On workflow_dispatch there is no PR diff → build.
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "site=true" >> "$GITHUB_OUTPUT"
            echo "tests=true" >> "$GITHUB_OUTPUT"
            echo "No PR diff (dispatch) → building and testing."
            exit 0
          fi
          # --no-renames, deliberately. With rename detection on, `git mv
          # src/Thing.tsx docs/Thing.md` prints ONLY docs/Thing.md, so a file moved
          # OUT of the site into a denylisted path reads as a docs-only change and
          # skips both the build and the browser suite, while the import it left
          # behind is broken. Measured on git 2.55.0: --name-only gives one path,
          # --name-status --no-renames gives the delete AND the add, so the source
          # path is seen and site=true. cut -f2- drops the status column.
          changed="$(git diff --name-status --no-renames "$BASE_SHA" "$HEAD_SHA" | cut -f2-)"
          echo "Changed files:"; echo "$changed"
          site=false
          tests=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # These subtrees are NOT part of the site bundle, so they must not
            # set site=true, but they carry unit suites, which used to run
            # nowhere: `terraform/*` is denylisted here, so a Lambda-only PR got
            # zero CI verification. Route them to the unit-tests job instead.
            #   contact-lambda-src: the 10 anti-abuse controls
            #   cdn-function:       the edge routing table (canonical URLs)
            #   alert-relay-src:    the last hop of the alerting chain, which
            #                       nothing downstream would notice failing
            # scripts/lib is NOT denylisted (it sets site=true too, since the
            # build imports it), but it must also run its own suite: blog-gate
            # decides which locale pages exist at all.
            case "$f" in
              terraform/contact-lambda-src/*|terraform/cdn-function/*|terraform/alert-relay-src/*|scripts/lib/*) tests=true ;;
            esac
            case "$f" in
              terraform/*|*.md|.env.example|.gitignore|LICENSE|.github/workflows/terraform.yml) : ;;
              *) site=true ;;
            esac
          done <<< "$changed"
          # This workflow's own definition gates both jobs.
          case "$changed" in
            *.github/workflows/ci.yml*) site=true; tests=true ;;
          esac
          echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "site-affecting change: $site | unit-tested subtree changed: $tests"

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.site == 'true'
    # Pinned to a commit SHA (not @main) so a mutable branch ref can't be used to
    # inject malicious workflow steps. Update the SHA deliberately on upgrade.
    uses: agusgonzaleznic/github-reusable-workflows/.github/workflows/vite-ci.yml@ee1cc3d04e2a1cf7998da955c0093c43c20fa199 # v1.1.0
    with:
      node-version: '22'
      install-command: 'npm ci'
      # i18n:check belongs in the static-analysis slot, not the build chain: it
      # only reads src/, so unlike typecheck it needs no generated data, and a
      # stale catalog should fail before anything expensive runs. It catches the
      # one failure mode a green build cannot: a <Trans> absent from the catalogs
      # renders its raw message ID (`s3qJ3e`) in production while the build exits
      # 0, because @lingui/swc-plugin strips the fallback text. Verified by
      # planting an unextracted string and reading it back out of dist/404.html.
      lint-command: 'npm run lint && npm run i18n:check'
      # `npm run typecheck` is NOT here. It cannot run before the build: two
      # modules import src/generated/*.json, which is gitignored build output
      # produced by fetch-blog/fetch-pages, so type-checking a fresh checkout
      # fails with TS2307 on files that are supposed to be absent. It runs
      # inside `npm run build` instead (after fetch, before the Vite builds),
      # which covers exactly the same PRs, since any TS change sets site=true.
      # (The build compiles via esbuild and STRIPS types, so without this step
      # nothing type-checked this repo at all.)
      # BLOG_FIXTURE=1 makes fetch-blog use content/fixtures/blog-fixture.json
      # instead of writing an empty blog. PR CI cannot receive secrets, so without
      # it every PR validated the site with ZERO articles (66 pages instead of
      # 84), and no PR ever exercised an article page, the per-article language
      # switcher, an hreflang cluster, RSS item content, or the assertion that no
      # emitted page links to an unemitted path.
      #
      # An env var on the command, deliberately NOT a secret in build-env-vars:
      # that input is how a multiline secret once reached public logs, and this
      # needs no secret at all.
      #
      # deploy.yml sets STORYBLOK_REQUIRE_TOKEN=1, and fetch-blog checks that
      # BEFORE the fixture branch, so a deploy can never fall back to fixtures.
      build-command: 'BLOG_FIXTURE=1 npm run build'
      artifact-path: 'dist'
      verify-build-output: true

  # Every unit suite outside the site bundle. Both have NO dependencies (pure
  # Node builtins, injected deps), so there is nothing to install and the job
  # takes seconds. Runs only when one of those subtrees changed; gated by
  # ci-required either way.
  unit-tests:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22' # match the Lambda runtime

      - name: Contact Lambda unit tests (10 anti-abuse controls)
        working-directory: terraform/contact-lambda-src
        run: node --test

      - name: CloudFront function unit tests (edge routing table)
        working-directory: terraform/cdn-function
        run: node --test

      - name: Alert relay unit tests (last hop of the alerting chain)
        working-directory: terraform/alert-relay-src
        run: node --test

      # Explicit glob, not `node --test scripts/lib/`: the directory form treats
      # every .mjs in there as a test file and fails on the modules that are not.
      - name: Publication-gate unit tests (which locale pages exist)
        run: node --test scripts/lib/*.test.mjs

  # The required status check. Always runs (needs + if: always()), so branch
  # protection always gets a result. Green when the build passed OR was skipped
  # (site unaffected); red only when the build actually ran and failed.
  # The 46 browser tests that drive the BUILT site: hydration on all 84 documents,
  # client-side navigation, the contact form's client validation, the mobile menu,
  # the real 404, and the per-locale page-data loader.
  #
  # WHEN IT RUNS: exactly when the built site can be affected, reusing the SAME
  # `changes.outputs.site` signal the build job uses rather than a second path list
  # that would drift from it. That signal is a DENYLIST, so it is true unless every
  # changed file is infra, docs or CI-only config: a terraform-only or docs-only PR
  # skips this job, and anything touching src/, index.html, the catalogs, the build
  # scripts, tests/e2e or a dependency runs it. Fail-safe in the right direction,
  # since a missed run is a regression shipped and a needless run costs two minutes.
  #
  # WHY IT BUILDS ITS OWN dist: the reusable build workflow's `artifact-path` input
  # only VERIFIES the directory exists, it uploads nothing (checked: a CI run has
  # zero artifacts), so there is no artifact to download. The duplicate build is the
  # price, and it runs in parallel with the build job rather than after it, so it
  # costs latency only when both would have failed anyway.
  #
  # NO SECRETS, so this works on a fork PR: the build is the same tokenless
  # `BLOG_FIXTURE=1` one the build job runs, and the suite adapts to that mode. See
  # tests/e2e/locale-page-data.test.mjs for why both modes assert something real.
  e2e:
    name: End-to-end tests
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    # A hung browser would otherwise sit here until the 6-hour default.
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Cache the browser download only. System deps are installed every run
      # because they live outside this path, so a cache hit with missing libs
      # would fail in a way that looks like a browser bug.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install chromium
        run: |
          npx playwright install-deps chromium
          npx playwright install chromium

      # Byte-for-byte the build job's command, and note WHICH invariants that
      # buys. This build has no Storyblok token, so the suite takes its tokenless
      # branch: no page-data chunk, one preload hint, and the hardcoded fallback
      # copy must hydrate clean. That is a real production path, the one taken when
      # the CMS is unreachable at build time, and nothing had exercised it in a
      # browser before. It is NOT the CMS branch though: the assertions that the
      # CMS-only copy survives hydration and that two hints are emitted run only
      # where a Storyblok token exists, which today means a developer's machine.
      # The regression that motivated the suite, an eager glob returning all six
      # locales to the entry chunk, IS covered in both modes by a source-level
      # check in tests/e2e/locale-page-data.test.mjs. So the residual gap is the
      # hint emission and the CMS copy survival, not the bundle size. The suite
      # prints the mode it detected, so a green check is never silent about which
      # set it measured.
      - name: Build the site
        run: BLOG_FIXTURE=1 npm run build

      - name: Run the browser suite
        env:
          # Playwright's own chromium, which is what `playwright install` provides.
          # The local default is channel "chrome", a browser the runner lacks.
          E2E_CHANNEL: bundled
        run: npm run test:e2e

  # House style, enforced rather than remembered. A one-time sweep decays: the
  # next comment or piece of copy reintroduces the character and review misses it.
  # Unconditional and cheap, because the rule covers every tracked text file, not
  # just the ones a site build touches.
  no-em-dash:
    name: No em dash
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - run: node scripts/assert-no-em-dash.mjs

  ci-required:
    name: CI required
    needs: [changes, build, unit-tests, no-em-dash, e2e]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Gate
        env:
          SITE: ${{ needs.changes.outputs.site }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          # Bracket notation is REQUIRED for a hyphenated job id: the dotted
          # form `needs.unit-tests.result` parses as a subtraction.
          TESTS_RESULT: ${{ needs['unit-tests'].result }}
          DASH_RESULT: ${{ needs['no-em-dash'].result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          echo "changes=${CHANGES_RESULT} site=${SITE} build=${BUILD_RESULT} tests=${TESTS_RESULT} dash=${DASH_RESULT} e2e=${E2E_RESULT}"
          # The detection job itself must have succeeded. Without this, a
          # checkout/network failure in `changes` made `build` "skipped" and this
          # gate went GREEN having built and tested nothing.
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::Change detection did not succeed (${CHANGES_RESULT}): cannot certify this PR."
            exit 1
          fi
          if [ "$BUILD_RESULT" = "failure" ] || [ "$BUILD_RESULT" = "cancelled" ]; then
            echo "::error::Site build failed."
            exit 1
          fi
          if [ "$TESTS_RESULT" = "failure" ] || [ "$TESTS_RESULT" = "cancelled" ]; then
            echo "::error::Unit tests failed."
            exit 1
          fi
          # This one runs unconditionally, so anything other than success is a
          # real result and must block, including "skipped".
          if [ "$DASH_RESULT" != "success" ]; then
            echo "::error::Em dash check did not pass (${DASH_RESULT})."
            exit 1
          fi
          # Conditional on changes.outputs.site, so "skipped" is a real and
          # correct outcome here, unlike the em dash check above which always runs.
          if [ "$E2E_RESULT" = "failure" ] || [ "$E2E_RESULT" = "cancelled" ]; then
            echo "::error::End-to-end tests failed."
            exit 1
          fi
          echo "OK (build ${BUILD_RESULT:-skipped}, tests ${TESTS_RESULT:-skipped}, e2e ${E2E_RESULT:-skipped})"
