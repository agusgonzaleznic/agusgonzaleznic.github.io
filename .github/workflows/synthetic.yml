name: Synthetic check

# Outside-in liveness probe for the things that can break with NO signal
# anywhere. Deliberately needs no AWS credentials, no OIDC and no role change:
# it only makes public HTTPS requests, so it can never become an escalation path
# and cannot be blocked by an IAM gap.
#
# Each assertion guards a specific past or plausible incident:
#   /                  200 — the site is served at all.
#   /api/contact       405 — the whole CloudFront -> OAC -> SigV4 -> Lambda chain
#                            is intact. This is the ONE check that would have
#                            caught the October-2025 Lambda Function URL auth
#                            change, which needed a second IAM statement and
#                            silently 403'd the contact form until found by hand.
#   /<random>          404 — the soft-404 invariant: a prerendered SSG must NOT
#                            serve 200 for unknown paths (see the SEO lessons —
#                            this is the failure that put pages in Search
#                            Console's soft-404 bucket).
#   /de/               200 — locale prefixes still resolve.
#   /blog/rss.xml      200 — generated feeds survived the build.

on:
  schedule:
    # 07:14 and 19:14 UTC. Off the hour on purpose: :00 is when every scheduled
    # workflow on GitHub fires at once and gets queued.
    - cron: "14 7,19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthetic
  cancel-in-progress: false

jobs:
  probe:
    name: Probe production
    runs-on: ubuntu-latest
    steps:
      - name: Assert the public contract
        run: |
          set -uo pipefail
          base="https://agusgonzaleznic.com"
          fails=0

          check() { # path expected description
            local path="$1" want="$2" desc="$3" got
            # --retry covers transient edge/network blips so the probe reports
            # real breakage rather than noise; a genuine outage still fails.
            got="$(curl -sS -o /dev/null -w '%{http_code}' \
                     --retry 3 --retry-delay 5 --retry-all-errors \
                     --max-time 20 "$base$path" || echo "000")"
            if [ "$got" = "$want" ]; then
              printf '  ok   %-28s %s\n' "$path" "$got"
            else
              printf '  FAIL %-28s got %s, want %s — %s\n' "$path" "$got" "$want" "$desc"
              echo "::error title=Synthetic check failed::$path returned $got, expected $want. $desc"
              fails=$((fails + 1))
            fi
          }

          check "/"                       200 "The site is not being served."
          check "/api/contact"            405 "The contact API is unreachable: CloudFront -> OAC -> SigV4 -> Lambda is broken (a 403 here is the Function-URL auth regression)."
          check "/synthetic-404-probe-$RANDOM" 404 "Unknown paths are not 404ing — the SPA fallback has returned and will produce soft-404s."
          check "/de/"                    200 "Locale-prefixed routes are not resolving."
          check "/blog/rss.xml"           200 "Generated feeds are missing from the build output."

          if [ "$fails" -gt 0 ]; then
            echo "$fails check(s) failed."
            exit 1
          fi
          echo "All checks passed."
