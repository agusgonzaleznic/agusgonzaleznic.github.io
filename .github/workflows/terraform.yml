name: Terraform

on:
  # Plan on PRs that touch the site module (or this workflow itself)
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

  # Apply (gated) on merges to main that touch the site module
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

  # Manual re-run of the gated apply (e.g. after a failed apply)
  workflow_dispatch:

# Default-deny; each job grants only what it needs.
permissions:
  contents: read

# Single state file — serialize all runs and never cancel an in-flight
# apply mid-mutation.
concurrency:
  group: terraform-state
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  # Storyblok Management API token (sensitive)
  TF_VAR_token: ${{ secrets.STORYBLOK_MANAGEMENT_TOKEN }}
  # Shared-secret token embedded in the webhook URL (sensitive)
  TF_VAR_storyblok_webhook_url_token: ${{ secrets.STORYBLOK_WEBHOOK_URL_TOKEN }}
  # Numeric Storyblok space id (non-secret)
  TF_VAR_space_id: ${{ vars.STORYBLOK_SPACE_ID }}
  # Cloudflare API token — Account > Turnstile > Edit (sensitive)
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  # Cloudflare account id that owns the Turnstile widget (non-secret)
  TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  # NOTE: the contact Lambda sends via SESv2 — no Apps Script variables. The
  # former CONTACT_APPS_SCRIPT_* GitHub secrets were deleted 2026-08-20.

defaults:
  run:
    # Site module. The bootstrap jobs below override this per job — they are
    # the ONLY jobs allowed to run in terraform/bootstrap/, and they use
    # separate OIDC roles (read-only for plan, gated write for apply).
    working-directory: terraform

jobs:
  plan:
    name: Plan (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for configure-aws-credentials
      contents: read
      pull-requests: write # sticky plan comment
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Guard — refuse to target bootstrap/
        run: |
          wd="$(pwd)"
          if [ "$(basename "$wd")" != "terraform" ] || printf '%s' "$wd" | grep -q 'bootstrap'; then
            echo "::error::This job must run in the site module (terraform/), got: $wd. bootstrap/ has its own jobs and roles."
            exit 1
          fi
          if [ -n "${TF_CLI_ARGS:-}${TF_CLI_ARGS_init:-}${TF_CLI_ARGS_plan:-}${TF_CLI_ARGS_apply:-}" ]; then
            echo "::error::TF_CLI_ARGS overrides are not allowed in CI."
            exit 1
          fi

      # Role trust must allow subject repo:agusgonzaleznic/agusgonzaleznic.github.io:pull_request
      - uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ vars.AWS_TF_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.*"
          # No wrapper: plan output is captured to a file for the PR comment.
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        # Keep going so the plan (or its error) still lands in the PR comment.
        continue-on-error: true
        run: |
          set -o pipefail
          terraform plan -no-color -input=false -lock-timeout=60s 2>&1 | tee plan.txt

      - name: Scrub secrets from plan before it goes public
        id: planscan
        # Defense-in-depth. Sensitive TF vars already render as
        # "(sensitive value)", but this plan is about to be posted to a
        # world-readable PR comment. Redact any secret-shaped substring first,
        # and flag it so the job fails and a human investigates. Redact-then-post
        # (not block) guarantees a secret can never reach the comment even if the
        # detector is imperfect.
        run: |
          before="$(sha256sum plan.txt | cut -d' ' -f1)"
          sed -i -E \
            -e 's/([?&](token|access_token|api_key|apikey|key|secret)=)[^ "'"'"'&]+/\1REDACTED/gI' \
            -e 's/(github_pat_|ghp_|gho_|ghs_)[A-Za-z0-9_]+/\1REDACTED/g' \
            plan.txt
          after="$(sha256sum plan.txt | cut -d' ' -f1)"
          if [ "$before" != "$after" ]; then
            echo "leaked=true" >> "$GITHUB_OUTPUT"
            echo "::error::Secret-shaped content found in terraform plan output and redacted before posting. Investigate before merging."
          fi

      - name: Post sticky plan comment
        if: always() && (steps.plan.outcome == 'success' || steps.plan.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        run: |
          MARKER='<!-- terraform-plan-sticky -->'
          {
            echo "$MARKER"
            echo "## Terraform plan — ${PLAN_OUTCOME}"
            echo ""
            echo "Commit: \`${HEAD_SHA}\` | Run: [${{ github.run_id }}](${{ github.server_url }}/${REPO}/actions/runs/${{ github.run_id }})"
            echo ""
            echo "<details><summary>Show plan output</summary>"
            echo ""
            echo '```'
            # Issue comments cap at 65536 chars; leave headroom.
            head -c 60000 plan.txt
            echo ""
            echo '```'
            echo ""
            echo "</details>"
          } > comment.md
          # Emit matching ids only (never "null") — --paginate runs the jq
          # program once per page, so an array-index form would yield one
          # value per page and break on multi-page PRs.
          cid="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id" | head -n1)"
          if [ -n "$cid" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${cid}" -F body=@comment.md > /dev/null
          else
            gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -F body=@comment.md > /dev/null
          fi

      - name: Fail job if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Fail job if a secret was found in the plan
        if: always() && steps.planscan.outputs.leaked == 'true'
        run: |
          echo "::error::terraform plan output contained secret-shaped content (redacted in the posted comment). Do not merge until resolved."
          exit 1

  # ---------------------------------------------------------------------------
  # Bootstrap tier (terraform/bootstrap): the state bucket, the OIDC provider
  # and every IAM role/policy CI itself depends on.
  #
  # This used to be applied by hand with AWS_PROFILE=root-admin, out of band and
  # on a different commit than the PR that needed it. It now runs here, so
  # adopting a new AWS service is one PR and one run. See role-bootstrap-ci.tf
  # for why a single `terraform apply` genuinely cannot do both halves.
  #
  # Ordering is real, not cosmetic: bootstrap-apply must land BEFORE the site
  # apply, because it is what grants the deploy role the permissions the site
  # plan is about to use.
  # ---------------------------------------------------------------------------
  # Refuse a PR that touches BOTH terraform tiers.
  #
  # A site resource that needs a new IAM grant cannot be planned before the grant
  # exists, and bootstrap-apply only runs post-merge — so a PR carrying both
  # produces a red site plan by construction. That was tolerated for five merges
  # ("expected, the authoritative plan is the one bootstrap-apply unblocks"), and
  # it normalised a red check so thoroughly that a real bug hid behind it: the
  # detect step's `tee` swallowed terraform's exit code, bootstrap-apply skipped
  # on every commit, and none of that terraform was ever applied.
  #
  # The rule is now mechanical: bootstrap changes ship in their own PR, merged and
  # applied first; the site PR that consumes the grant then plans GREEN. Two
  # merges, both verified.
  #
  # Escape hatch: label the PR `allow-cross-tier` when the site change provably
  # does NOT depend on the bootstrap change (e.g. a comment-only edit in one
  # tier). Use it sparingly — it re-opens the hole.
  tier-split:
    name: Tier split
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse a PR spanning both terraform tiers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          boot=false
          site=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # Only files that can change a PLAN count. Docs in either tier are
            # irrelevant here, and counting them produced a false positive on a
            # two-README PR — which would have pushed people toward the override
            # label and hollowed out the rule.
            case "$f" in
              *.md) continue ;;
            esac
            case "$f" in
              terraform/bootstrap/*) boot=true ;;
              terraform/*) site=true ;;
            esac
          done <<< "$changed"
          echo "bootstrap-tier touched: $boot | site-tier touched: $site"

          if [ "$boot" = true ] && [ "$site" = true ]; then
            case ",$LABELS," in
              *,allow-cross-tier,*)
                echo "::warning title=Cross-tier PR allowed by label::This PR touches both terraform tiers. The site plan may be unverifiable; confirm it is green before merging."
                exit 0
                ;;
            esac
            echo "::error title=Split this PR by tier::It changes BOTH terraform/bootstrap/ and the site module. A site resource needing a new grant cannot plan before the grant is applied, so merging this means merging an unverified plan. Ship the bootstrap change first, apply it, then open the site PR — see the note in terraform/README.md. Override with the allow-cross-tier label only if the site change does not depend on the bootstrap change."
            exit 1
          fi
          echo "OK — single-tier PR (or no terraform changes)."

  bootstrap-plan:
    name: Bootstrap plan (PR)
    # The AWS_TF_BOOTSTRAP_* repo variables are the adoption switch. Until the
    # roles in role-bootstrap-ci.tf exist and the variables are set, these jobs
    # skip instead of failing on an empty role-to-assume — which is also what
    # makes this workflow mergeable before that first human apply.
    if: github.event_name == 'pull_request' && vars.AWS_TF_BOOTSTRAP_PLAN_ROLE_ARN != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/bootstrap
    permissions:
      id-token: write # OIDC token for configure-aws-credentials
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Guard — bootstrap dir, no CLI-arg overrides
        run: |
          wd="$(pwd)"
          case "$wd" in
            */terraform/bootstrap) ;;
            *) echo "::error::This job must run in terraform/bootstrap, got: $wd"; exit 1 ;;
          esac
          if [ -n "${TF_CLI_ARGS:-}${TF_CLI_ARGS_init:-}${TF_CLI_ARGS_plan:-}${TF_CLI_ARGS_apply:-}" ]; then
            echo "::error::TF_CLI_ARGS overrides are not allowed in CI."
            exit 1
          fi

      # READ-ONLY role. A PR plan runs code from a branch and must never hold
      # iam: write — that is the whole reason there are two bootstrap roles.
      - uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ vars.AWS_TF_BOOTSTRAP_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.*"
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      # -lock=false: the plan role deliberately has no s3:PutObject, so it
      # cannot write a .tflock. A read-only plan needs no lock.
      - name: Terraform plan
        id: plan
        continue-on-error: true
        # tee, not `>`: a plan job whose failure is only visible in the job
        # summary cannot be debugged from the log.
        run: |
          set -o pipefail
          terraform plan -no-color -input=false -lock=false 2>&1 | tee plan.txt

      - name: Publish plan to job summary
        if: always()
        # Job summaries are world-readable on a public repo — scrub
        # secret-shaped substrings (defense-in-depth beyond sensitive=true).
        run: |
          sed -E -e 's/([?&](token|access_token|api_key|apikey|key|secret)=)[^ "'"'"'&]+/\1REDACTED/gI' -e 's/(github_pat_|ghp_|gho_|ghs_)[A-Za-z0-9_]+/\1REDACTED/g' plan.txt | head -c 60000 > plan-summary.txt || true
          {
            echo "## Bootstrap plan (terraform/bootstrap)"
            echo ""
            echo '```'
            cat plan-summary.txt
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail job if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  bootstrap-detect:
    name: Bootstrap plan (main)
    # Runs UNGATED because it is read-only, and it exists so the reviewer sees
    # the plan BEFORE being asked to approve. An environment gate fires before
    # its job produces anything, so without this the approval would be blind.
    if: |
      vars.AWS_TF_BOOTSTRAP_PLAN_ROLE_ARN != ''
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/bootstrap
    permissions:
      id-token: write # OIDC token for configure-aws-credentials
      contents: read
    outputs:
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Guard — bootstrap dir, no CLI-arg overrides
        run: |
          wd="$(pwd)"
          case "$wd" in
            */terraform/bootstrap) ;;
            *) echo "::error::This job must run in terraform/bootstrap, got: $wd"; exit 1 ;;
          esac
          if [ -n "${TF_CLI_ARGS:-}${TF_CLI_ARGS_init:-}${TF_CLI_ARGS_plan:-}${TF_CLI_ARGS_apply:-}" ]; then
            echo "::error::TF_CLI_ARGS overrides are not allowed in CI."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ vars.AWS_TF_BOOTSTRAP_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.*"
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false

      # Detect by PLAN, not by changed paths. A path filter is a heuristic that
      # is wrong in both directions: it asks for an approval on a no-op merge,
      # and it skips the apply when drift or a module bump means real changes
      # with no file touched. -detailed-exitcode: 0 = none, 1 = error, 2 = changes.
      - name: Detect changes
        id: detect
        run: |
          # REDIRECT, then cat — do NOT pipe to tee here.
          #
          # This step's whole job is to capture terraform's -detailed-exitcode
          # (0 = no changes, 2 = changes). GitHub Actions runs steps with
          # `bash -e {0}`, WITHOUT pipefail, so `terraform ... | tee` yields
          # TEE's status, not terraform's: the `||` never fired, `code` stayed 0,
          # and has_changes was reported false on every single run — so the gated
          # bootstrap-apply could never execute. It skipped silently while the
          # plan printed "1 to add, 1 to change" right above it.
          code=0
          terraform plan -no-color -input=false -lock=false -detailed-exitcode \
            > plan.txt 2>&1 || code=$?
          cat plan.txt

          # Cross-check the exit code against the plan TEXT. Nothing else notices
          # a wrong-but-valid code, which is exactly how the bug above survived:
          # the failure mode is a silent skip, not an error.
          if [ "$code" = "0" ] && grep -qE '^Plan: [0-9]+ to add, [0-9]+ to change, [0-9]+ to destroy' plan.txt; then
            echo "::error::exit code reported NO changes but the plan lists changes — the exit-code capture is broken, refusing to skip the apply."
            exit 1
          fi

          case "$code" in
            0) echo "has_changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "has_changes=true"  >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::bootstrap plan failed (exit $code)"; exit 1 ;;
          esac

      - name: Publish plan to job summary
        if: always()
        run: |
          sed -E -e 's/([?&](token|access_token|api_key|apikey|key|secret)=)[^ "'"'"'&]+/\1REDACTED/gI' -e 's/(github_pat_|ghp_|gho_|ghs_)[A-Za-z0-9_]+/\1REDACTED/g' plan.txt | head -c 60000 > plan-summary.txt || true
          {
            echo "## Bootstrap plan — changes: ${{ steps.detect.outputs.has_changes }}"
            echo ""
            echo '```'
            cat plan-summary.txt
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  bootstrap-apply:
    name: Bootstrap apply (gated)
    needs: bootstrap-detect
    # Only when there is something to do, so routine site-only merges keep
    # needing exactly one approval, as they do today.
    if: needs.bootstrap-detect.outputs.has_changes == 'true' && vars.AWS_TF_BOOTSTRAP_ROLE_ARN != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/bootstrap
    # THE REQUIRED REVIEWER ON THIS ENVIRONMENT IS THE ONLY CONTROL over an
    # admin-equivalent role. github-terraform-bootstrap trusts exactly the
    # subject repo:<org>/<repo>:environment:terraform-bootstrap, so removing the
    # reviewer silently converts a review gate into an auto-apply of IAM.
    environment: terraform-bootstrap
    permissions:
      id-token: write # OIDC token for configure-aws-credentials
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Guard — bootstrap dir, no CLI-arg overrides
        run: |
          wd="$(pwd)"
          case "$wd" in
            */terraform/bootstrap) ;;
            *) echo "::error::This job must run in terraform/bootstrap, got: $wd"; exit 1 ;;
          esac
          if [ -n "${TF_CLI_ARGS:-}${TF_CLI_ARGS_init:-}${TF_CLI_ARGS_plan:-}${TF_CLI_ARGS_apply:-}" ]; then
            echo "::error::TF_CLI_ARGS overrides are not allowed in CI."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ vars.AWS_TF_BOOTSTRAP_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.*"
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false

      # Re-plan under the WRITE role and apply that saved plan. The detect job's
      # plan cannot be reused: different role, and an unlocked plan is not a safe
      # apply input.
      - name: Terraform plan
        run: terraform plan -no-color -input=false -lock-timeout=60s -out=tfplan

      - name: Publish plan to job summary
        run: |
          terraform show -no-color tfplan \
            | sed -E -e 's/([?&](token|access_token|api_key|apikey|key|secret)=)[^ "'"'"'&]+/\1REDACTED/gI' -e 's/(github_pat_|ghp_|gho_|ghs_)[A-Za-z0-9_]+/\1REDACTED/g' \
            | head -c 60000 > plan-summary.txt
          {
            echo "## Bootstrap plan (about to apply)"
            echo ""
            echo '```'
            cat plan-summary.txt
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false -lock-timeout=60s tfplan

      # IAM is eventually consistent, and the site plan that follows is about to
      # use whatever was just granted. Cheaper than debugging a flaky
      # AccessDenied on a first-adoption run.
      - name: Let IAM propagate
        run: sleep 20

  apply:
    name: Apply (main)
    # main only — including manual dispatch, so the gated apply can never run
    # a non-main branch's version of the Terraform code.
    needs: [bootstrap-detect, bootstrap-apply]
    # `!failure() && !cancelled()` rather than the default success(): bootstrap-apply
    # is SKIPPED whenever the bootstrap tier has no changes, and a skipped need
    # would otherwise skip this job too. A genuine bootstrap failure still stops
    # the site apply, which is the point of the ordering.
    if: |
      !failure() && !cancelled()
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Add a required reviewer on this environment to gate applies.
    # NOTE: with an environment, the OIDC subject becomes
    # repo:agusgonzaleznic/agusgonzaleznic.github.io:environment:terraform-production
    # — the CI role trust policy must allow it.
    environment: terraform-production
    permissions:
      id-token: write # OIDC token for configure-aws-credentials
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Guard — refuse to target bootstrap/
        run: |
          wd="$(pwd)"
          if [ "$(basename "$wd")" != "terraform" ] || printf '%s' "$wd" | grep -q 'bootstrap'; then
            echo "::error::This job must run in the site module (terraform/), got: $wd. bootstrap/ has its own jobs and roles."
            exit 1
          fi
          if [ -n "${TF_CLI_ARGS:-}${TF_CLI_ARGS_init:-}${TF_CLI_ARGS_plan:-}${TF_CLI_ARGS_apply:-}" ]; then
            echo "::error::TF_CLI_ARGS overrides are not allowed in CI."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ vars.AWS_TF_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.*"
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false

      # Plan and apply the SAME saved plan in one job — a PR-time plan file
      # cannot safely carry across to a different ref/run.
      - name: Terraform plan
        run: terraform plan -no-color -input=false -lock-timeout=60s -out=tfplan

      - name: Publish plan to job summary
        # The job summary is world-readable on a public repo. Scrub secret-shaped
        # substrings from the rendered plan (defense-in-depth beyond sensitive=true).
        run: |
          terraform show -no-color tfplan \
            | sed -E \
                -e 's/([?&](token|access_token|api_key|apikey|key|secret)=)[^ "'"'"'&]+/\1REDACTED/gI' \
                -e 's/(github_pat_|ghp_|gho_|ghs_)[A-Za-z0-9_]+/\1REDACTED/g' \
            | head -c 60000 > plan-summary.txt
          {
            echo "## Terraform plan (about to apply)"
            echo ""
            echo '```'
            cat plan-summary.txt
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false -lock-timeout=60s tfplan
